server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript
        application/xml text/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Hashed build assets (vite writes content hashes into the filename) can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must always be revalidated so a new deploy is picked up on next load instead
    # of being served from a stale cached shell.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # react-router uses client-side (browser) routing — unknown paths fall back to index.html
    # so the SPA's own router can resolve them instead of nginx 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
