services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-my-react-app}
        # Relative path so the browser calls same-origin /api/v1 (nginx proxies to backend).
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_API_KEY: ${VITE_API_KEY:-}
        VITE_ENCRYPT_DECRYPT_KEY: ${VITE_ENCRYPT_DECRYPT_KEY:-}
        VITE_USE_MOCK_API: ${VITE_USE_MOCK_API:-false}
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://10.3.33.31:3000}
    ports:
      - "4153:80"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
